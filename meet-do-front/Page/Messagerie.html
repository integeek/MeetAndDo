<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie — Meet&amp;Do</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Styles du projet -->
  <link rel="stylesheet" href="../Component/Navbar/Navbar.css" />
  <link rel="stylesheet" href="../Component/Footer/Footer.css" />
  <link rel="stylesheet" href="../Style/Messagerie.css" />
</head>
<body>

  <!-- Navbar -->
  <div class="navbar-container" id="navbar-root"></div>

  <!-- Page principale -->
  <main id="messagerie-app">

    <!-- Sidebar gauche : liste des conversations -->
    <aside class="conv-sidebar" id="conv-sidebar">
      <div class="conv-sidebar-header">
        <h2 class="conv-sidebar-title">Messages</h2>
        <button type="button" class="btn-icon" id="btn-new-conv" title="Nouvelle conversation">
          <i class="bi bi-pencil-square"></i>
        </button>
      </div>

      <!-- Bandeau Mon ID (pour les tests) -->
      <div class="my-id-bar" id="my-id-bar" title="Cliquer pour copier votre ID">
        <i class="bi bi-person-badge"></i>
        <span class="my-id-label">Mon ID :</span>
        <span class="my-id-value" id="my-id-value">…</span>
        <i class="bi bi-clipboard my-id-copy" id="my-id-copy"></i>
      </div>

      <div class="conv-search-wrapper">
        <i class="bi bi-search conv-search-icon"></i>
        <input
          type="text"
          id="conv-search"
          class="conv-search"
          placeholder="Rechercher une conversation…"
          aria-label="Rechercher une conversation"
        />
      </div>

      <ul class="conv-list" id="conv-list" role="list">
        <!-- Conversations injectées par JS -->
      </ul>
    </aside>

    <!-- Panneau droit : conversation active -->
    <section class="chat-panel" id="chat-panel">

      <!-- État vide -->
      <div class="chat-empty" id="chat-empty">
        <i class="bi bi-chat-dots chat-empty-icon"></i>
        <p class="chat-empty-text">Sélectionnez une conversation<br/>pour commencer à échanger</p>
      </div>

      <!-- Vue conversation active -->
      <div class="chat-view" id="chat-view" hidden>

        <!-- En-tête de la conversation -->
        <div class="chat-header" id="chat-header">
          <button type="button" class="btn-icon btn-back" id="btn-back" title="Retour aux conversations">
            <i class="bi bi-arrow-left"></i>
          </button>
          <div class="chat-header-avatar" id="chat-header-avatar">A</div>
          <div class="chat-header-info">
            <span class="chat-header-name" id="chat-header-name">Contact</span>
            <span class="chat-header-status" id="chat-header-status">En ligne</span>
          </div>
        </div>

        <!-- Zone des messages -->
        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
          <!-- Messages injectés par JS -->
        </div>

        <!-- Preview pièce jointe -->
        <div class="attachment-preview" id="attachment-preview" hidden>
          <div class="attachment-preview-inner" id="attachment-preview-inner"></div>
          <button type="button" class="attachment-remove" id="attachment-remove" title="Supprimer">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Zone de saisie -->
        <div class="chat-input-area">
          <input type="file" id="file-input" accept="image/*,.pdf,.txt" hidden aria-hidden="true" />
          <button type="button" class="btn-icon" id="btn-attach" title="Joindre un fichier">
            <i class="bi bi-paperclip"></i>
          </button>
          <input
            type="text"
            id="msg-input"
            class="chat-input"
            placeholder="Écrire un message…"
            aria-label="Écrire un message"
            autocomplete="off"
          />
          <button type="button" class="btn-send" id="btn-send" title="Envoyer le message">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container" id="footer-root"></div>
  </footer>

  <!-- Composants -->
  <script src="../Component/Navbar/Navbar.js"></script>
  <script src="../Component/Footer/Footer.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Logique de la messagerie -->
  <script src="../Script/Messagerie.js"></script>
</body>
</html>
