<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messaging — Meet&amp;Do</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Project styles -->
  <link rel="stylesheet" href="../Component/Navbar/Navbar.css" />
  <link rel="stylesheet" href="../Component/Footer/Footer.css" />
  <link rel="stylesheet" href="../Style/Messagerie.css" />
</head>
<body>

  <!-- Navbar -->
  <div class="navbar-container" id="navbar-root"></div>

  <!-- Main page -->
  <main id="messagerie-app">

    <!-- Left sidebar: conversation list -->
    <aside class="conv-sidebar" id="conv-sidebar">
      <div class="conv-sidebar-header">
        <h2 class="conv-sidebar-title">Messages</h2>
        <button type="button" class="btn-icon" id="btn-new-conv" title="New conversation">
          <i class="bi bi-pencil-square"></i>
        </button>
      </div>

      <div class="conv-search-wrapper">
        <i class="bi bi-search conv-search-icon"></i>
        <input
          type="text"
          id="conv-search"
          class="conv-search"
          placeholder="Search conversations…"
          aria-label="Search conversations"
        />
      </div>

      <ul class="conv-list" id="conv-list" role="list">
        <!-- Conversations injected by JS -->
      </ul>
    </aside>

    <!-- Right panel: active conversation -->
    <section class="chat-panel" id="chat-panel">

      <!-- Empty state -->
      <div class="chat-empty" id="chat-empty">
        <i class="bi bi-chat-dots chat-empty-icon"></i>
        <p class="chat-empty-text">Select a conversation<br/>to start chatting</p>
      </div>

      <!-- Active conversation view -->
      <div class="chat-view" id="chat-view" hidden>

        <!-- Conversation header -->
        <div class="chat-header" id="chat-header">
          <button type="button" class="btn-icon btn-back" id="btn-back" title="Back to conversations">
            <i class="bi bi-arrow-left"></i>
          </button>
          <div class="chat-header-avatar" id="chat-header-avatar">A</div>
          <div class="chat-header-info">
            <span class="chat-header-name" id="chat-header-name">Contact</span>
            <span class="chat-header-status" id="chat-header-status">Online</span>
          </div>
        </div>

        <!-- Message area -->
        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
          <!-- Messages injected by JS -->
        </div>

        <!-- Attachment preview -->
        <div class="attachment-preview" id="attachment-preview" hidden>
          <div class="attachment-preview-inner" id="attachment-preview-inner"></div>
          <button type="button" class="attachment-remove" id="attachment-remove" title="Remove">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
          <input type="file" id="file-input" accept="image/*,.pdf,.txt" hidden aria-hidden="true" />
          <button type="button" class="btn-icon" id="btn-attach" title="Attach a file">
            <i class="bi bi-paperclip"></i>
          </button>
          <input
            type="text"
            id="msg-input"
            class="chat-input"
            placeholder="Type a message…"
            aria-label="Type a message"
            autocomplete="off"
          />
          <button type="button" class="btn-send" id="btn-send" title="Send message">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container" id="footer-root"></div>
  </footer>

  <!-- Components -->
  <script src="../Component/Navbar/Navbar.js"></script>
  <script src="../Component/Footer/Footer.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Messaging logic -->
  <script src="../Script/Messagerie.js"></script>
</body>
</html>
