<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../Style/Login.css">
    <link rel="stylesheet" href="../Component/Footer/Footer.css">
    <link rel="stylesheet" href="../Component/Navbar/Navbar.css">
    <link rel="stylesheet" href="../Component/Button/BlueButton.css">
    <script src="../Script/TogglePassword.js" defer></script>
    <script src="../Component/Navbar/Navbar.js"></script>
    <script src="../Component/Footer/Footer.js"></script>
    <script src="../Component/Button/BlueButton.js"></script>
    <script src="../Script/Login.js" defer></script>

</head>
<body>
    <div class="backgroundImage"></div>
    <header>
        <div id="navbar-container" class="navbar-container"></div>	
        <script>
            document.getElementById('navbar-container').innerHTML = Navbar();
        </script>
    </header>
    <main>
        <div class="parentDiv">
            <div class="containerLogin">
                <h1>Login</h1>
                <form id="loginForm">
                    <p>Email</p>
                    <input class="textbox" type="text" name="email" placeholder="email@address.com" required>
                    <p>Password</p>
                    <div id="containerPassword">
                        <input class="textbox" type="password" id="password" name="password" placeholder="********" required>
                        <img class="togglePassword" src="../assets/img/icon-eye-open.png" alt="Show/Hide" >
                    </div>
                    <p id="forgotPassword">Forgot your password ?</p>
                    <div id="forgotModal" class="modal" style="display:none;">
                        <div class="modal-content">
                            <span id="closeModal" class="close">&times;</span>
                            <h2>Reset password</h2>
                            <p>Enter your email address to receive a reset link.</p>
                            <input class="textbox" type="email" id="forgotEmail" name="forgotEmail" placeholder="email@address.com">
                            <div class="erreurModal" style="color: red; margin-bottom: 1rem;"></div>
                            <div class="successModal" style="color: green; margin-bottom: 1rem;"></div>
                            <div id="sendResetLink"></div>
                            <script>
                                document.getElementById('sendResetLink').innerHTML = BoutonBleu("Send Reset Link");
                            </script>                        
                        </div>
                    </div>
                    <div>
                        <p id="noAccount">No account ?</p> <a  id="signup" href="Signup.html">Signup</a>
                    </div>
                    <div class="erreur" style="color: red; margin-bottom: 1rem;">
                    </div>
                    <div class="success" style="color: black; margin-bottom: 1rem; font-weight: bold;">
                    </div>
                    
                    <div id="boutonContainer"></div>
                    <script>
                        document.getElementById('boutonContainer').innerHTML = BoutonBleu("Login");
                    </script>
                </form>
            </div>
        </div>
    </main> 
    <footer id="footer-container" class="footer-container">
        <script>
            document.getElementById('footer-container').innerHTML = Footer("..");
        </script>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
