<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My activities</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../Style/MyActivity.css" />
    <link rel="stylesheet" href="../Component/Footer/Footer.css" />
    <link rel="stylesheet" href="../Component/Navbar/Navbar.css" />
    <link rel="stylesheet" href="../Component/Button/BlueButton.css" />
    <link rel="stylesheet" href="../Component/Button/RedButton.css" />
  </head>
  <body>
    <header>
      <div id="navbar-container" class="navbar-container"></div>
    </header>

    <main class="container px-3 px-md-4 px-lg-5 py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md">
              <h1>My activities</h1>
              <p class="page-subtitle mb-0">
                Find all the activities you have created here.
              </p>
            </div>
            <div class="col-12 col-md-auto">
              <div id="create-activity-button" class="d-inline-block"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center pt-4">
        <div class="col-12 col-lg-10">
          <div id="my-activities-list" class="row g-4"></div>
        </div>
      </div>
    </main>

    <footer id="footer-container" class="footer-container"></footer>

    <div
      class="modal fade"
      id="activityActionsModal"
      tabindex="-1"
      aria-labelledby="activityActionsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="activityActionsModalLabel">
              Activity actions
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p id="activity-actions-modal-text" class="mb-4"></p>
            <div class="d-grid gap-3">
              <div id="modal-view-activity-button"></div>
              <div id="modal-edit-activity-button"></div>
              <div id="modal-delete-activity-button"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="activityDeleteConfirmModal"
      tabindex="-1"
      aria-labelledby="activityDeleteConfirmModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="activityDeleteConfirmModalLabel">
              Supprimer l'activité
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p id="activity-delete-confirm-text" class="mb-3"></p>
            <div id="activity-delete-upcoming-wrapper" class="mb-3 d-none">
              <p class="fw-semibold mb-2">Créneaux / événements à venir</p>
              <ul
                id="activity-delete-upcoming-list"
                class="activity-delete-upcoming-list mb-0"
              ></ul>
            </div>
            <p
              id="activity-delete-feedback"
              class="small mb-0 activity-delete-feedback"
            ></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Annuler
            </button>
            <div id="activity-confirm-delete-button"></div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../Script/MyActivity.js"></script>
    <script src="../Component/Footer/Footer.js"></script>
    <script src="../Component/Navbar/Navbar.js"></script>
    <script src="../Component/Navbar/NavAction.js"></script>
    <script src="../Component/Button/BlueButton.js"></script>
    <script src="../Component/Button/RedButton.js"></script>
    <script>
      if (document.getElementById("navbar-container")) {
        document.getElementById("navbar-container").innerHTML = Navbar();
      }
      if (document.getElementById("footer-container")) {
        document.getElementById("footer-container").innerHTML = Footer("..");
      }
      if (
        window.initializeNavbar &&
        document.getElementById("navbar-container")
      ) {
        window.initializeNavbar();
      }
    </script>
  </body>
</html>
