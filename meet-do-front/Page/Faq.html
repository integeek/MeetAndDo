<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="../Style/Faq.css">
  <link rel="stylesheet" type="text/css" href="../Component/Footer/Footer.css">
  <link rel="stylesheet" type="text/css" href="../Component/Navbar/Navbar.css">
  <link rel="stylesheet" type="text/css" href="../Component/Button/BlueButton.css">
  <link rel="stylesheet" type="text/css" href="../Component/Button/RedButton.css">
  <script src="../Component/Navbar/Navbar.js"></script>
  <script src="../Component/Footer/Footer.js"></script>
  <script src="../Component/Button/BlueButton.js"></script>
  <script src="../Component/Button/RedButton.js"></script>
  <script src="../Script/Faq.js" defer></script>
</head>
<body>
    <header>
        <div id="navbar-container" class="navbar-container"></div>
        <script>
            document.getElementById('navbar-container').innerHTML = Navbar();
        </script>
    </header>
    <br>
    <div class="faq-wrapper">
        <h1>Frequently Asked Questions</h1>
        <div id="boutonContainer" onclick="openPopUp('edit-email-popup')" style="display: inline-block; margin-bottom: 1rem;"></div>
        <script>
            document.getElementById('boutonContainer').innerHTML = BoutonBleu("Create a question");
        </script>
        <div id="faq-container"></div>
    </div>

    <div class="edit-container" id="edit-email-popup">
        <div class="edit-content">
            <div class="edit-header">
            <h3>Add a question in the FAQ</h3>
            </div>
            <div class="edit-main">
            <input type="text" id="faq-question-input" placeholder="Enter your question here" />
            <input type="text" id="faq-answer-input" placeholder="Enter your answer here" />
            </div>
            <div class="edit-footer">
            <div id="bouton-rouge3" onclick="closePopUp('edit-email-popup')"></div>
            <script>document.getElementById("bouton-rouge3").innerHTML = BoutonRouge("Cancel");</script>
            <div id="bouton-bleue3" onclick="createFaq()"></div>
            <script>document.getElementById("bouton-bleue3").innerHTML = BoutonBleu("Add");</script>
            </div>
        </div>
    </div>

    <div class="edit-container" id="edit-faq-popup">
        <div class="edit-content">
            <div class="edit-header">
            <h3>Update the question</h3>
            </div>
            <div class="edit-main">
            <input type="text" id="edit-faq-question-input" placeholder="Enter your question here" />
            <input type="text" id="edit-faq-answer-input" placeholder="Enter your answer here" />
            </div>
            <div class="edit-footer">
            <div id="bouton-rouge4" onclick="closePopUp('edit-faq-popup')"></div>
            <script>document.getElementById("bouton-rouge4").innerHTML = BoutonRouge("Cancel");</script>
            <div id="bouton-bleue4" onclick="updateFaq()"></div>
            <script>document.getElementById("bouton-bleue4").innerHTML = BoutonBleu("Update");</script>
            </div>
        </div>
    </div>

    <footer>
        <div id="footer-container" class="footer-container"></div>
        <script>
            document.getElementById('footer-container').innerHTML = Footer("..");
        </script>
    </footer>
</body>
</html>
