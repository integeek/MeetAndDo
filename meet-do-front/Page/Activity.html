<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../Style/Activity.css" />
    <link rel="stylesheet" href="../Component/Footer/Footer.css" />
    <link rel="stylesheet" href="../Component/Navbar/Navbar.css" />
    <link rel="stylesheet" href="../Component/Button/BlueButton.css" />
    <link rel="stylesheet" href="../Component/Button/RedButton.css" />
  </head>
  <body>
    <header>
      <div id="navbar-container" class="navbar-container"></div>
    </header>

    <main class="container px-4 px-md-4 px-lg-5 py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
          <div class="row">
            <div class="col text-start">
              <h1 id="activity-title"></h1>
            </div>
            <div class="col-auto d-flex align-items-start">
              <div id="activity-report-button"></div>
            </div>
            <div class="col-12 mt-3">
              <div class="row justify-content-start">
                <div class="col-auto">
                  <div
                    class="d-inline-flex align-items-center gap-2 flex-nowrap"
                  >
                    <span
                      class="activity-address-icon d-inline-flex flex-shrink-0"
                      aria-hidden="true"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                      >
                        <path
                          fill="#000"
                          d="M12 11.5A2.5 2.5 0 0 1 9.5 9A2.5 2.5 0 0 1 12 6.5A2.5 2.5 0 0 1 14.5 9a2.5 2.5 0 0 1-2.5 2.5M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7"
                        />
                      </svg>
                    </span>
                    <p id="activity-address-text" class="mb-0 fw-medium"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row justify-content-center mt-4">
            <div class="col-12">
              <div id="activity-images" class="activity-images"></div>
            </div>
          </div>

          <div class="row justify-content-center my-5">
            <div class="col-12">
              <hr class="my-0 activity-divider" />
            </div>
          </div>

          <section class="row g-5 pb-5">
            <div class="col-12 col-lg-7 text-start">
              <div class="row">
                <div class="col-12 activity-content">
                  <h2 class="fw-bold mb-3">Activity description</h2>
                  <p id="activity-description-text" class="mb-0"></p>
                </div>
              </div>

              <div class="row pt-4">
                <div class="col-12 activity-content">
                  <p id="activity-group-size" class="mb-0 fw-semibold"></p>
                </div>
              </div>

              <div class="row pt-4">
                <div class="col-12 activity-content">
                  <div class="row">
                    <div class="col-12">
                      <p
                        id="activity-price"
                        class="mb-3 text-start fw-semibold"
                      ></p>
                    </div>
                  </div>
                  <div
                    class="row gx-5 gy-3 justify-content-center justify-content-lg-start"
                  >
                    <div
                      class="col-auto"
                      id="activity-participate-button"
                    ></div>
                    <div class="col-auto" id="activity-review-button"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-5">
              <div class="row pb-5">
                <div class="col-12 activity-content">
                  <div class="row gy-3">
                    <div class="col-12">
                      <p
                        id="activity-created-by"
                        class="mb-0 text-start creator-meta"
                      ></p>
                    </div>
                    <div class="col-12">
                      <div
                        class="row align-items-center justify-content-between gy-3"
                      >
                        <div class="col">
                          <div class="row align-items-center gx-3 gy-2">
                            <div class="col-auto">
                              <img
                                id="creator-avatar"
                                class="creator-avatar"
                                alt="Creator photo"
                              />
                            </div>
                            <div class="col">
                              <p
                                id="creator-name"
                                class="mb-1 fw-semibold text-start"
                              ></p>
                              <p
                                id="creator-rating"
                                class="mb-0 text-start"
                              ></p>
                            </div>
                          </div>
                        </div>
                        <div class="col-auto">
                          <div id="creator-contact-button"></div>
                          <p
                            id="creator-contact-feedback"
                            class="creator-contact-feedback mb-0 d-none"
                          ></p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 activity-content">
                  <div
                    class="row align-items-center justify-content-between gy-2 mb-3"
                  >
                    <div class="col-auto">
                      <h2 class="fw-bold mb-0">Activity reviews</h2>
                    </div>
                    <div class="col-auto">
                      <div class="d-flex align-items-center gap-2">
                        <span class="review-star-icon" aria-hidden="true">
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                          >
                            <path
                              fill="currentColor"
                              d="m12 17.27l6.18 3.73l-1.64-7.03L22 9.24l-7.19-.61L12 2L9.19 8.63L2 9.24l5.46 4.73L5.82 21z"
                            />
                          </svg>
                        </span>
                        <span
                          id="activity-reviews-rating"
                          class="fw-semibold"
                        ></span>
                      </div>
                    </div>
                  </div>
                  <div
                    id="activity-reviews-list"
                    class="reviews-scrollable"
                  ></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer id="footer-container" class="footer-container"></footer>

    <!-- Report Modal -->
    <div
      class="modal fade"
      id="reportActivityModal"
      tabindex="-1"
      aria-labelledby="reportModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reportModalLabel">
              Report this activity
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="report-form">
              <div class="mb-3">
                <label for="report-reason" class="form-label"
                  >Reason for report</label
                >
                <select class="form-select" id="report-reason" required>
                  <option value="">-- Select a reason --</option>
                  <option value="contenu-inapproprie">
                    Inappropriate content
                  </option>
                  <option value="arnaque">Scam/Fraud</option>
                  <option value="harcellement">Harassment</option>
                  <option value="prix-anormal">Abnormal price</option>
                  <option value="autre">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="report-description" class="form-label"
                  >Description (optional)</label
                >
                <textarea
                  class="form-control"
                  id="report-description"
                  rows="4"
                  placeholder="Briefly describe the issue..."
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-danger" id="report-submit-btn">
              Report
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reservation Modal -->
    <div
      class="modal fade"
      id="reservationEventsModal"
      tabindex="-1"
      aria-labelledby="reservationEventsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reservationEventsModalLabel">
              Available events
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p id="reservation-events-feedback" class="mb-3 text-secondary">
              Choose an event to reserve your spot.
            </p>
            <div
              id="reservation-events-list"
              class="reservation-events-list"
              role="list"
            ></div>
            <div
              id="reservation-summary"
              class="reservation-summary d-none"
              aria-live="polite"
            ></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="reservation-review-button"
              disabled
            >
              Review reservation
            </button>
            <button
              type="button"
              class="btn btn-primary d-none"
              id="reservation-confirm-button"
            >
              Confirm reservation
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../Script/Activity.js"></script>
    <script src="../Component/Footer/Footer.js"></script>
    <script src="../Component/Navbar/Navbar.js"></script>
    <script src="../Component/Navbar/NavAction.js"></script>
    <script src="../Component/Button/BlueButton.js"></script>
    <script src="../Component/Button/RedButton.js"></script>
    <script>
      if (document.getElementById("navbar-container")) {
        document.getElementById("navbar-container").innerHTML = Navbar();
      }
      if (document.getElementById("footer-container")) {
        document.getElementById("footer-container").innerHTML = Footer("..");
      }
      if (
        window.initializeNavbar &&
        document.getElementById("navbar-container")
      ) {
        window.initializeNavbar();
      }
    </script>
  </body>
</html>
